<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphOSINT</title>
    
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2/src/index.js" integrity="sha512-jGVhgUeHozcJQl2S14/LQwB1Xoube/CwYeOmckWGq2f+lHOa0ecYZOhXq6hzmF9B1JeE609znEAYo8hNypunjA==" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js" integrity="sha512-iTgTmIgxyA2YehKNVbzLJx4j9SnuC5ihtRrtxVkXH/9nF3vXBN5YeNQp+6wufBWKD3u+roHVNOvWBMufQnBbug==" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-canvas: #09090B;
            --bg-panel: #18181B;
            --border: #27272A;
            --text-main: #F4F4F5;
            --text-muted: #A1A1AA;
            --accent: #3B82F6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-canvas); color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px; background-position: center center;
        }

        /* --- TOP BAR --- */
        .topbar {
            background: rgba(9, 9, 11, 0.9); border-bottom: 1px solid var(--border);
            padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .brand { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; color: #D4D4D8; }
        .brand i { color: var(--accent); font-size: 1.4rem; }
        
        .toolbar-group { display: flex; gap: 8px; }
        .btn-top {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .btn-top:hover { background: var(--bg-panel); color: white; border-color: var(--border); }

        /* --- SEARCH --- */
        .search-group {
            display: flex; align-items: center; gap: 8px; background: var(--bg-panel);
            border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
            min-width: 260px; max-width: 420px; flex: 1;
        }
        .search-group i { color: var(--text-muted); font-size: 1rem; flex-shrink: 0; }
        .search-input {
            background: transparent; border: none; outline: none; color: var(--text-main);
            font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; flex: 1; min-width: 0;
        }
        .search-input::placeholder { color: #52525B; }
        .search-status { font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }

        /* --- WORKSPACE --- */
        .workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
        #mynetwork { position: absolute; top: 0; left: 0; right: 0; bottom: 0; outline: none; }
        
        /* --- FLOATING TOOLBAR --- */
        .floating-toolbar {
            position: absolute; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 10;
        }
        .tool-btn {
            width: 48px; height: 48px; border-radius: 12px; background: var(--bg-panel); border: 1px solid var(--border);
            color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .tool-btn:hover { background: #27272A; color: white; transform: translateX(2px); }
        .tool-btn.active { background: var(--accent); color: white; border-color: #60A5FA; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .tool-btn.danger:hover { background: #EF4444; color: white; border-color: #F87171; }
        
        /* Tooltip for the toolbar */
        .tool-btn::after {
            content: attr(data-tooltip); position: absolute; left: 60px; background: var(--text-main); color: var(--bg-canvas);
            padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: 0.2s; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .tool-btn:hover::after { opacity: 1; left: 65px; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 350px; background: rgba(24, 24, 27, 0.95); border-left: 1px solid var(--border); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title { margin: 0; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; gap: 8px; color: #E4E4E7;}
        .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; }
        .close-btn:hover { color: white; }
        .sidebar-content { padding: 20px; overflow-y: auto; }
        .data-group { margin-bottom: 20px; }
        .data-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.05em; }
        .data-value { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: #E4E4E7; word-break: break-all; background: #09090B; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-box { background: #18181B; border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 450px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .modal-title { margin: 0 0 24px 0; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; gap: 10px;}
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;}
        .custom-select, .custom-input { width: 100%; background: #09090B; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
        .custom-input:focus, .custom-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; }
        .btn-modal { padding: 10px 20px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: 0.2s; border: 1px solid transparent;}
        .btn-cancel { background: transparent; color: var(--text-muted); }
        .btn-cancel:hover { background: #27272A; color: white; }
        .btn-confirm { background: var(--accent); color: white; }
        .btn-confirm:hover { background: #2563EB; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        .context-menu { 
            position: fixed; /* FIXED: follows the mouse perfectly */
            background: rgba(24, 24, 27, 0.85); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 8px; padding: 6px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,0,0,0.5); 
            z-index: 9999; display: none; min-width: 240px; 
        }

        .menu-item { 
            padding: 10px 14px; cursor: pointer; border-radius: 6px; transition: 0.1s; 
            display: flex; align-items: center; gap: 12px; font-size: 0.85rem; font-weight: 500; 
            color: #E4E4E7; letter-spacing: 0.02em; 
        }
        .menu-item i { font-size: 1.1rem; color: #9CA3AF; }
        .menu-item:hover { background: var(--accent); color: white; }
        .menu-item:hover i { color: white; }
        .menu-separator { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
        .menu-danger:hover { background: #EF4444 !important; color: white !important; }
        .menu-danger:hover i { color: white !important; }

        /* --- TOAST NOTIFICATIONS --- */
        .toast-container { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 50; }
        .toast {
            background: #18181B; border: 1px solid var(--border); color: white; padding: 12px 24px; border-radius: 8px;
            font-size: 0.85rem; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
            opacity: 0; transform: translateY(20px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-left: 4px solid #10B981; }
        .toast.info { border-left: 4px solid #3B82F6; }
        .toast.error { border-left: 4px solid #EF4444; }
        .toast-action-btn {
            margin-left: 4px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; white-space: nowrap; flex-shrink: 0;
        }
        .toast-action-btn:hover { background: rgba(255,255,255,0.25); }
        /* --- NOTES / MEMOS --- */
        .memo-container {
            margin-top: 24px;
            background: rgba(9, 9, 11, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .memo-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1), inset 0 0 0 1px var(--accent);
        }
        .memo-header {
            background: #18181B;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .memo-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .memo-title i { color: var(--accent); font-size: 1.1rem; }
        
        /* Autosave indicator */
        .memo-status {
            font-size: 0.65rem;
            color: #10B981; /* Success green */
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .memo-status.saving { opacity: 1; }
        
        .memo-textarea {
            width: 100%;
            min-height: 140px;
            background: transparent;
            border: none;
            color: #E4E4E7;
            padding: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }
        .memo-textarea::placeholder { color: #52525B; font-style: italic; }
        
        /* Custom scrollbar for the text area */
        .memo-textarea::-webkit-scrollbar { width: 6px; }
        .memo-textarea::-webkit-scrollbar-track { background: transparent; }
        .memo-textarea::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 3px; }
        .memo-textarea::-webkit-scrollbar-thumb:hover { background: #52525B; }
        .vis-manipulation { display: none !important; }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="brand"><i class="ph-fill ph-hexagon"></i> Graph<span style="color: #52525B; font-weight: 400;">OSINT</span></div>
        <div class="search-group">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search..." autocomplete="off">
            <span class="search-status" id="search-status"></span>
        </div>
        <div class="toolbar-group">
            <button class="btn-top" onclick="document.getElementById('fileInput').click()"><i class="ph ph-upload-simple"></i> Import JSON</button>
            <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="importJSON(event)">
            <button class="btn-top" onclick="exportJSON()"><i class="ph ph-floppy-disk"></i> Save JSON</button>
            <div style="width: 1px; background: var(--border); margin: 0 8px;"></div>
            <button class="btn-top" onclick="exportPNG()"><i class="ph ph-image"></i> Export PNG</button>
        </div>
    </div>

    <div class="workspace">
        <div class="floating-toolbar">
            <button class="tool-btn" data-tooltip="Create entity" onclick="openNodeModal()">
                <i class="ph ph-plus"></i>
            </button>
            
            <button class="tool-btn" data-tooltip="Undo (Ctrl+Z)" onclick="undo()">
                <i class="ph ph-arrow-u-up-left"></i>
            </button>
            <button class="tool-btn" data-tooltip="Redo (Ctrl+Y)" onclick="redo()">
                <i class="ph ph-arrow-u-up-right"></i>
            </button>
            
            <button class="tool-btn" id="btn-link" data-tooltip="Link two entities" onclick="toggleEdgeMode()" style="margin-top: 10px;">
                <i class="ph ph-vector-two"></i>
            </button>
            <button class="tool-btn danger" data-tooltip="Delete selection" onclick="deleteSelected()">
                <i class="ph ph-trash"></i>
            </button>
            <button class="tool-btn" data-tooltip="Reset workspace" onclick="clearGraph()" style="margin-top: 20px;">
                <i class="ph ph-broom"></i>
            </button>
        </div>

        <div id="mynetwork"></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4 class="sidebar-title"><i class="ph-fill ph-scan"></i> Entity Properties</h4>
                <button class="close-btn" onclick="closeSidebar()"><i class="ph ph-x"></i></button>
            </div>
            <div id="sidebar-content" class="sidebar-content"></div>
        </div>

        <div class="toast-container" id="toast-container"></div>
        <div id="contextMenu" class="context-menu"></div>
    </div>

    <div class="modal-overlay" id="nodeModal">
        <div class="modal-box">
            <h3 class="modal-title"><i class="ph-fill ph-cube"></i> New Entity</h3>
            <div class="form-group">
                <label class="form-label">Classification</label>
                <select class="custom-select" id="nodeType">
                    <option value="person">Identity</option>
                    <option value="company">Company</option>
                    <option value="phone">Phone</option>
                    <option value="email">Email Address</option>
                    <option value="address">Physical Address</option>
                    <option value="id">Username</option>
                    <option value="ip">IP Address</option>
                    <option value="bank">Bank Information</option>
                    <option value="note">Note</option>
                </select>
           
            <div class="form-group" id="platform-group" style="display: none;">
                <label class="form-label">Platform (ex: twitter.com)</label>
                <input type="text" class="custom-input" id="nodePlatform" placeholder="Domain for logo..." autocomplete="off">
            </div>
            </div>
            <div class="form-group">
                <label class="form-label">Value</label>
                <input type="text" class="custom-input" id="nodeValue" placeholder="ex: johndoe1" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeNodeModal()">Cancel</button>
                <button class="btn-modal btn-confirm" onclick="saveNewNode()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
    // --- UTILITIES ---
    window.addEventListener('error', function(e) { if (e.message.includes('ResizeObserver')) e.stopImmediatePropagation(); });

    function generateSafeUUID() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
        return 'node_' + Date.now().toString(36) + Math.random().toString(36).substring(2);
    }

    // --- OSINT ICON GENERATOR (SVG) ---
        function createIconUrl(pathData, bgColor) {
            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="128" height="128">
                <circle cx="24" cy="24" r="24" fill="${bgColor}" />
                <g transform="translate(12, 12)">
                    <path fill="#FFFFFF" d="${pathData}"/>
                </g>
            </svg>`;
            return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace(/\n/g, '').replace(/\s+/g, ' '));
        }
    
        function escapeHTML(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, function(tag) {
                const charsToReplace = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
                return charsToReplace[tag] || tag;
            });
        }

        function buildMenuItem(iconClass, text, handler, danger) {
            const item = document.createElement('div');
            item.className = 'menu-item' + (danger ? ' menu-danger' : '');
            const icon = document.createElement('i');
            icon.className = iconClass;
            item.appendChild(icon);
            item.appendChild(document.createTextNode(' ' + text));
            item.addEventListener('click', handler);
            return item;
        }

        function buildMenuSeparator() {
            const sep = document.createElement('div');
            sep.className = 'menu-separator';
            return sep;
        }
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        let icon = 'ph-info';
        if(type === 'success') icon = 'ph-check-circle';
        if(type === 'error') icon = 'ph-warning-circle';
        
        toast.innerHTML = `<i class="ph-fill ${icon}" style="font-size: 1.2rem;"></i> <span>${message}</span>`;
        container.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function showDuplicateToast(existingId, newId, existingValue) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast error';

        const icon = document.createElement('i');
        icon.className = 'ph-fill ph-warning-circle';
        icon.style.fontSize = '1.2rem';
        toast.appendChild(icon);

        const span = document.createElement('span');
        span.textContent = `Probable duplicate: "${existingValue}" already exists.`;
        toast.appendChild(span);

        const btn = document.createElement('button');
        btn.className = 'toast-action-btn';
        btn.textContent = 'Merge';
        btn.addEventListener('click', function() {
            mergeNodes(existingId, newId);
            dismissToast(toast);
        });
        toast.appendChild(btn);

        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        var autoDismiss = setTimeout(() => dismissToast(toast), 8000);
        btn.addEventListener('click', () => clearTimeout(autoDismiss));
    }

    function dismissToast(toast) {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }

    function checkDuplicateFor(nodeId) {
        var node = nodes.get(nodeId);
        if (!node || !node.details) return;
        var type = node.details.TypeKey;
        var raw = (node.details["Raw Data"] || "").trim().toLowerCase();
        if (!raw) return;

        var match = nodes.get().find(function(n) {
            return n.id !== nodeId && n.details &&
                n.details.TypeKey === type &&
                (n.details["Raw Data"] || "").trim().toLowerCase() === raw;
        });

        if (match) showDuplicateToast(match.id, nodeId, match.details["Raw Data"]);
    }

    // --- ENTITY SEARCH ---
    function performSearch(query) {
        query = query.trim().toLowerCase();
        searchMatches = [];
        searchIndex = -1;

        if (query && nodes) {
            nodes.get().forEach(function(n) {
                var label = (n.label || "").toLowerCase();
                var raw = (n.details && n.details["Raw Data"] || "").toLowerCase();
                if (label.includes(query) || raw.includes(query)) searchMatches.push(n.id);
            });
        }

        updateSearchStatus();
        if (searchMatches.length > 0) goToSearchMatch(0);
    }

    function goToSearchMatch(index) {
        if (!network || searchMatches.length === 0) return;
        searchIndex = ((index % searchMatches.length) + searchMatches.length) % searchMatches.length;
        var id = searchMatches[searchIndex];

        network.selectNodes([id]);
        network.focus(id, { scale: 1.2, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
        openSidebar(nodes.get(id));
        updateSearchStatus();
    }

    function updateSearchStatus() {
        var status = document.getElementById('search-status');
        if (!status) return;
        var query = document.getElementById('searchInput').value.trim();
        if (!query) { status.textContent = ''; }
        else if (searchMatches.length === 0) { status.textContent = '0 results'; }
        else { status.textContent = (searchIndex + 1) + '/' + searchMatches.length; }
    }

    // --- VECTOR CONFIGURATION ---
        const ENTITY_CONFIG = {

    // --- FUNCTION B: MERGE TWO ENTITIES ---
    function mergeNodes(targetId, sourceId) {
        document.getElementById('contextMenu').style.display = 'none';

        var connectedEdges = network.getConnectedEdges(sourceId);
        var newEdges = [];

        connectedEdges.forEach(function(edgeId) {
            var edge = edges.get(edgeId);
            
            if ((edge.from === targetId && edge.to === sourceId) || (edge.from === sourceId && edge.to === targetId)) {
                return;
            }

            // Copy the edge and redirect it to the Target
            var newEdge = { ...edge, id: generateSafeUUID() }; 
            if (newEdge.from === sourceId) newEdge.from = targetId;
            if (newEdge.to === sourceId) newEdge.to = targetId;
            newEdges.push(newEdge);
        });

        // 2. Merge metadata
        var targetNode = nodes.get(targetId);
        var sourceNode = nodes.get(sourceId);

        if(sourceNode.details && targetNode.details) {
            for (const [key, value] of Object.entries(sourceNode.details)) {
                if(key !== "TypeKey" && key !== "Classification") {
                     if(!targetNode.details[key]) {
                         targetNode.details[key] = value; // Add missing info
                     } else if (targetNode.details[key] !== value) {
                         targetNode.details[key + " (Old)"] = value; // Keep track of conflicts
                     }
                }
            }
            nodes.update(targetNode);
        }

        // 3. Nuclear execution: replace the edges and destroy the Source
        edges.remove(connectedEdges); 
        edges.add(newEdges);          
        nodes.remove(sourceId);       

        network.unselectAll();
        showToast("Entities merged successfully.", "success");
        openSidebar(nodes.get(targetId)); // Refresh the panel
    }

    // --- AUTOSAVE SYSTEM (LOCALSTORAGE) ---
        function autoSaveGraph() {
            if (!network) return;
            
            var currentPositions = network.getPositions();
            var nodesData = nodes.get().map(n => {
                if (currentPositions[n.id]) {
                    n.x = currentPositions[n.id].x;
                    n.y = currentPositions[n.id].y;
                }
                return n;
            });
            
            var backup = { nodes: nodesData, edges: edges.get() };
            localStorage.setItem('GraphOSINT_Autosave', JSON.stringify(backup));
        }
        // --- TIME MACHINE (UNDO / REDO) ---
        var historyStack = [];
        var historyIndex = -1;
        var isRestoring = false;

        function saveSnapshot() {
            if (isRestoring || !network) return;

            var currentPositions = network.getPositions();
            var nodesData = nodes.get().map(n => {
                if (currentPositions[n.id]) {
                    n.x = currentPositions[n.id].x;
                    n.y = currentPositions[n.id].y;
                }
                return n;
            });
            
            var snapshot = JSON.stringify({ nodes: nodesData, edges: edges.get() });

            if (historyIndex >= 0 && historyStack[historyIndex] === snapshot) return;

            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(snapshot);

            if (historyStack.length > 10) {
                historyStack.shift();
            } else {
                historyIndex++;
            }
        }

        function restoreSnapshot(index) {
            if (index < 0 || index >= historyStack.length) return;
            
            isRestoring = true; // Lock it
            try {
                var parsed = JSON.parse(historyStack[index]);
                nodes.clear();
                edges.clear();
                nodes.add(parsed.nodes);
                edges.add(parsed.edges);
                network.fit({ animation: { duration: 500 } });
            } catch(e) {
                console.error("Restore error", e);
            }
            
            isRestoring = false;
            autoSaveGraph(); 
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreSnapshot(historyIndex);
                showToast("Action undone", "info");
            } else {
                showToast("Nothing to undo", "error");
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                restoreSnapshot(historyIndex);
                showToast("Action redone", "info");
            }
        }

        document.addEventListener('keydown', function(e) {
            var activeTag = document.activeElement.tagName.toLowerCase();
            if (activeTag === 'input' || activeTag === 'textarea') return;

            if (e.ctrlKey || e.metaKey) { // Supports Mac (Cmd) and Windows/Linux (Ctrl)
                if (e.key === 'z') { e.preventDefault(); undo(); }
                if (e.key === 'y' || (e.shiftKey && e.key === 'z') || (e.shiftKey && e.key === 'Z')) { e.preventDefault(); redo(); }
            }
        });

    function clearGraph() { 
            if(confirm("Clear the entire workspace and delete the autosave?")) { 
                nodes.clear(); 
                edges.clear(); 
                closeSidebar(); 
                localStorage.removeItem('GraphOSINT_Autosave'); 
                
                showToast("Workspace and memory reset.", "success");
            } 
        }

    // The network canvas itself has a transparent background (the dark
    // page background is plain CSS behind it), so a raw export shows the
    // light node/edge text with nothing behind it. This paints the canvas
    // onto an opaque copy filled with the app's background color first.
    function flattenCanvasBackground(canvas) {
        var out = document.createElement('canvas');
        out.width = canvas.width;
        out.height = canvas.height;
        var ctx = out.getContext('2d');
        ctx.fillStyle = '#09090B';
        ctx.fillRect(0, 0, out.width, out.height);
        ctx.drawImage(canvas, 0, 0);
        return out;
    }

    // Favicon images (icon.horse) are loaded cross-origin without CORS
    // headers, which taints the canvas and blocks toDataURL(). To export
    // anyway, node images that aren't already a same-origin data: URI are
    // temporarily swapped for the generated OSINT icon, captured, then
    // restored once the capture is done.
    function withExportableCanvas(callback) {
        var canvas = document.querySelector('#mynetwork canvas');
        try {
            callback(flattenCanvasBackground(canvas));
            return;
        } catch (err) {
            // Tainted canvas: fall through to the swap-and-retry path below.
        }

        var externalNodes = nodes.get().filter(n => n.image && !n.image.startsWith('data:'));
        if (externalNodes.length === 0) {
            showToast("Export blocked by a browser security restriction.", "error");
            return;
        }

        var backups = externalNodes.map(n => ({ id: n.id, image: n.image }));
        var swapped = externalNodes.map(n => {
            var config = ENTITY_CONFIG[n.details && n.details.TypeKey];
            return { id: n.id, image: config ? createIconUrl(config.path, config.color) : n.image };
        });

        nodes.update(swapped);
        network.once("afterDrawing", function() {
            var cleanCanvas = document.querySelector('#mynetwork canvas');
            try {
                callback(flattenCanvasBackground(cleanCanvas));
            } catch (err2) {
                showToast("Export blocked by a browser security restriction.", "error");
            }
            nodes.update(backups);
        });
    }

    function exportPNG() {
        withExportableCanvas(function(canvas) {
            var link = document.createElement('a');
            link.download = 'GraphOSINT-export.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
            showToast("PNG export complete.", "success");
        });
    }

    function exportJSON() {
        var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ nodes: nodes.get(), edges: edges.get() }, null, 2));
        var link = document.createElement('a'); link.href = dataStr; link.download = "GraphOSINT-export.json"; link.click();
        showToast("JSON save successful.", "success");
    }

    function importJSON(event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var data = JSON.parse(e.target.result);
                
                var safeNodes = [];
                if (data.nodes && Array.isArray(data.nodes)) {
                    data.nodes.forEach(function(n) {
                        if (n.id && n.details) {
                            safeNodes.push({
                                id: escapeHTML(String(n.id)),
                                x: Number(n.x) || 0,
                                y: Number(n.y) || 0,
                                label: n.label ? String(n.label) : "",
                                shape: n.shape,
                                image: n.image,
                                size: Number(n.size) || 24,
                                color: n.color,
                                font: n.font,
                                borderWidth: 2,
                                physics: n.physics === false ? false : undefined,
                                details: n.details
                            });
                        }
                    });
                }

                var safeEdges = [];
                if (data.edges && Array.isArray(data.edges)) {
                    data.edges.forEach(function(ed) {
                        if (ed.from && ed.to) {
                            var edLabel = ed.label ? escapeHTML(String(ed.label)) : "";
                            safeEdges.push({
                                id: escapeHTML(String(ed.id)),
                                from: escapeHTML(String(ed.from)),
                                to: escapeHTML(String(ed.to)),
                                label: edLabel,
                                color: edLabel ? { color: colorForEdgeLabel(edLabel), highlight: '#FFFFFF' } : undefined,
                                font: ed.font
                            });
                        }
                    });
                }

                nodes.add(safeNodes);
                edges.add(safeEdges);
                
                network.fit({animation: {duration: 1000}});
                document.getElementById('fileInput').value = '';
                showToast("Database loaded.", "success");
                
            } catch (err) { 
                console.error("Parse error:", err);
                showToast("Invalid JSON file.", "error"); 
            }
        };
        reader.readAsText(file);
    }
</script>
</body>
