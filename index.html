<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphOSINT</title>
    
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2/src/index.js" integrity="sha512-jGVhgUeHozcJQl2S14/LQwB1Xoube/CwYeOmckWGq2f+lHOa0ecYZOhXq6hzmF9B1JeE609znEAYo8hNypunjA==" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js" integrity="sha512-iTgTmIgxyA2YehKNVbzLJx4j9SnuC5ihtRrtxVkXH/9nF3vXBN5YeNQp+6wufBWKD3u+roHVNOvWBMufQnBbug==" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-canvas: #09090B;
            --bg-canvas-rgb: 9, 9, 11;
            --bg-panel: #18181B;
            --bg-panel-rgb: 24, 24, 27;
            --border: #27272A;
            --text-main: #F4F4F5;
            --text-muted: #A1A1AA;
            --accent: #3B82F6;
            --grid-line: rgba(255,255,255,0.03);
        }

        html.light {
            --bg-canvas: #F1F5F9;
            --bg-canvas-rgb: 241, 245, 249;
            --bg-panel: #FFFFFF;
            --bg-panel-rgb: 255, 255, 255;
            --border: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --grid-line: rgba(15,23,42,0.05);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-canvas); color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px; background-position: center center;
            transition: background-color 0.2s;
        }

        /* --- TOP BAR --- */
        .topbar {
            background: rgba(var(--bg-canvas-rgb), 0.9); border-bottom: 1px solid var(--border);
            padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
            gap: 16px;
        }
        .brand { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; color: var(--text-main); flex-shrink: 0; }
        .brand i { color: var(--accent); font-size: 1.4rem; }
        
        .toolbar-group { display: flex; gap: 8px; }
        .btn-top {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .btn-top:hover { background: var(--bg-panel); color: white; border-color: var(--border); }

        /* --- SEARCH --- */
        .search-group {
            display: flex; align-items: center; gap: 8px; background: var(--bg-panel);
            border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
            min-width: 260px; max-width: 420px; flex: 1;
        }
        .search-group i { color: var(--text-muted); font-size: 1rem; flex-shrink: 0; }
        .search-input {
            background: transparent; border: none; outline: none; color: var(--text-main);
            font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; flex: 1; min-width: 0;
        }
        .search-input::placeholder { color: #52525B; }
        .search-status { font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }

        /* --- WORKSPACE --- */
        .workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
        #mynetwork { position: absolute; top: 0; left: 0; right: 0; bottom: 0; outline: none; }
        
        /* --- FLOATING TOOLBAR --- */
        .floating-toolbar {
            position: absolute; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 10;
        }
        .tool-btn {
            width: 48px; height: 48px; border-radius: 12px; background: var(--bg-panel); border: 1px solid var(--border);
            color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .tool-btn:hover { background: #27272A; color: white; transform: translateX(2px); }
        .tool-btn.active { background: var(--accent); color: white; border-color: #60A5FA; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .tool-btn.danger:hover { background: #EF4444; color: white; border-color: #F87171; }
        
        /* Tooltip for the toolbar */
        .tool-btn::after {
            content: attr(data-tooltip); position: absolute; left: 60px; background: var(--text-main); color: var(--bg-canvas);
            padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: 0.2s; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .tool-btn:hover::after { opacity: 1; left: 65px; }

        .btn-top[data-tooltip] { position: relative; }
        .btn-top[data-tooltip]::after {
            content: attr(data-tooltip); position: absolute; top: 100%; right: 0; margin-top: 8px;
            background: var(--text-main); color: var(--bg-canvas); padding: 4px 10px; border-radius: 6px;
            font-size: 0.75rem; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none;
            transition: 0.2s; text-transform: uppercase; letter-spacing: 0.05em; z-index: 30;
        }
        .btn-top[data-tooltip]:hover::after { opacity: 1; margin-top: 12px; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 350px; background: rgba(var(--bg-panel-rgb), 0.95); border-left: 1px solid var(--border); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title { margin: 0; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; gap: 8px; color: var(--text-main);}
        .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; }
        .close-btn:hover { color: var(--text-main); }
        .sidebar-content { padding: 20px; overflow-y: auto; }
        .data-group { margin-bottom: 20px; }
        .data-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.05em; }
        .data-value { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--text-main); word-break: break-all; background: var(--bg-canvas); padding: 10px; border-radius: 6px; border: 1px solid var(--border); }

        /* --- TAGS --- */
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .tag-chip {
            display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 999px;
            font-size: 0.7rem; font-weight: 600; color: #fff; letter-spacing: 0.02em;
        }
        .tag-chip button { background: rgba(0,0,0,0.25); border: none; color: #fff; width: 16px; height: 16px; border-radius: 50%; cursor: pointer; font-size: 0.65rem; line-height: 1; display: flex; align-items: center; justify-content: center; }
        .tag-chip button:hover { background: rgba(0,0,0,0.45); }
        .tag-add-row { display: flex; gap: 6px; }
        .tag-add-row input[type="text"] {
            flex: 1; background: var(--bg-canvas); border: 1px solid var(--border); color: var(--text-main);
            padding: 8px 10px; border-radius: 6px; font-size: 0.8rem; min-width: 0;
        }
        .tag-add-row input[type="color"] { width: 34px; height: 34px; padding: 2px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-canvas); cursor: pointer; }
        .tag-add-row button { background: var(--accent); border: none; color: white; border-radius: 6px; padding: 0 12px; cursor: pointer; font-size: 0.9rem; }
        .tag-add-row button:hover { background: #2563EB; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 450px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .modal-title { margin: 0 0 24px 0; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;}
        .custom-select, .custom-input { width: 100%; background: var(--bg-canvas); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
        .custom-input:focus, .custom-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; }
        .btn-modal { padding: 10px 20px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: 0.2s; border: 1px solid transparent;}
        .btn-cancel { background: transparent; color: var(--text-muted); }
        .btn-cancel:hover { background: var(--border); color: var(--text-main); }
        .btn-confirm { background: var(--accent); color: white; }
        .btn-confirm:hover { background: #2563EB; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        /* --- STATS --- */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-tile { background: var(--bg-canvas); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
        .stat-tile .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }
        .stat-tile .stat-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; margin-top: 4px; }
        .stat-breakdown-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; color: var(--text-main); }
        .stat-breakdown-row:last-child { border-bottom: none; }
        .stat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }

        .context-menu {
            position: fixed; /* FIXED: follows the mouse perfectly */
            background: rgba(var(--bg-panel-rgb), 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 6px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,0,0,0.5);
            z-index: 9999; display: none; min-width: 240px;
        }

        .menu-item {
            padding: 10px 14px; cursor: pointer; border-radius: 6px; transition: 0.1s;
            display: flex; align-items: center; gap: 12px; font-size: 0.85rem; font-weight: 500;
            color: var(--text-main); letter-spacing: 0.02em;
        }
        .menu-item i { font-size: 1.1rem; color: #9CA3AF; }
        .menu-item:hover { background: var(--accent); color: white; }
        .menu-item:hover i { color: white; }
        .menu-separator { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
        .menu-danger:hover { background: #EF4444 !important; color: white !important; }
        .menu-danger:hover i { color: white !important; }

        /* --- TOAST NOTIFICATIONS --- */
        .toast-container { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 50; }
        .toast {
            background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); padding: 12px 24px; border-radius: 8px;
            font-size: 0.85rem; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
            opacity: 0; transform: translateY(20px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-left: 4px solid #10B981; }
        .toast.info { border-left: 4px solid #3B82F6; }
        .toast.error { border-left: 4px solid #EF4444; }
        .toast-action-btn {
            margin-left: 4px; background: var(--accent); border: 1px solid var(--accent);
            color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; white-space: nowrap; flex-shrink: 0;
        }
        .toast-action-btn:hover { background: #2563EB; }
        /* --- NOTES / MEMOS --- */
        .memo-container {
            margin-top: 24px;
            background: rgba(var(--bg-canvas-rgb), 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .memo-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1), inset 0 0 0 1px var(--accent);
        }
        .memo-header {
            background: var(--bg-panel);
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .memo-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .memo-title i { color: var(--accent); font-size: 1.1rem; }
        
        /* Autosave indicator */
        .memo-status {
            font-size: 0.65rem;
            color: #10B981; /* Success green */
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .memo-status.saving { opacity: 1; }
        
        .memo-textarea {
            width: 100%;
            min-height: 140px;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }
        .memo-textarea::placeholder { color: #52525B; font-style: italic; }
        
        /* Custom scrollbar for the text area */
        .memo-textarea::-webkit-scrollbar { width: 6px; }
        .memo-textarea::-webkit-scrollbar-track { background: transparent; }
        .memo-textarea::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 3px; }
        .memo-textarea::-webkit-scrollbar-thumb:hover { background: #52525B; }
        .vis-manipulation { display: none !important; }

        /* --- FILTER PANEL --- */
        .filter-panel {
            position: absolute; left: 80px; top: 24px; z-index: 15; display: none;
            background: rgba(var(--bg-panel-rgb), 0.95); border: 1px solid var(--border); border-radius: 10px;
            padding: 14px; min-width: 210px; backdrop-filter: blur(10px); box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .filter-panel.active { display: block; }
        .filter-panel-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .filter-panel-title span.link { color: var(--accent); cursor: pointer; text-transform: none; font-weight: 600; font-size: 0.7rem; }
        .filter-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 0.8rem; color: var(--text-main); cursor: pointer; }
        .filter-row input { accent-color: var(--accent); cursor: pointer; }
        .filter-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

        /* --- MINIMAP --- */
        #minimap {
            position: absolute; right: 24px; bottom: 24px; width: 180px; height: 120px; z-index: 10;
            background: rgba(var(--bg-panel-rgb), 0.8); border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); cursor: pointer; display: none;
        }
        #minimap.visible { display: block; }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="brand"><i class="ph-fill ph-hexagon"></i> Graph<span style="color: #52525B; font-weight: 400;">OSINT</span></div>
        <div class="search-group">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search..." autocomplete="off">
            <span class="search-status" id="search-status"></span>
        </div>
        <div class="toolbar-group">
            <button class="btn-top" onclick="document.getElementById('fileInput').click()"><i class="ph ph-upload-simple"></i> Import JSON</button>
            <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="importJSON(event)">
            <button class="btn-top" onclick="document.getElementById('csvInput').click()"><i class="ph ph-table"></i> Import CSV</button>
            <input type="file" id="csvInput" accept=".csv,.txt" style="display: none;" onchange="importCSV(event)">
            <button class="btn-top" onclick="exportJSON()"><i class="ph ph-floppy-disk"></i> Save JSON</button>
            <div style="width: 1px; background: var(--border); margin: 0 8px;"></div>
            <button class="btn-top" onclick="exportPNG()"><i class="ph ph-image"></i> Export PNG</button>
            <button class="btn-top" onclick="exportSVG()"><i class="ph ph-file-svg"></i> Export SVG</button>
            <div style="width: 1px; background: var(--border); margin: 0 8px;"></div>
            <button class="btn-top" onclick="openStatsModal()"><i class="ph ph-chart-bar"></i> Stats</button>
            <button class="btn-top" id="btn-theme" onclick="toggleTheme()" data-tooltip="Toggle theme"><i class="ph ph-sun"></i></button>
        </div>
    </div>

    <div class="workspace">
        <div class="floating-toolbar">
            <button class="tool-btn" data-tooltip="Create entity" onclick="openNodeModal()">
                <i class="ph ph-plus"></i>
            </button>
            
            <button class="tool-btn" data-tooltip="Undo (Ctrl+Z)" onclick="undo()">
                <i class="ph ph-arrow-u-up-left"></i>
            </button>
            <button class="tool-btn" data-tooltip="Redo (Ctrl+Y)" onclick="redo()">
                <i class="ph ph-arrow-u-up-right"></i>
            </button>
            
            <button class="tool-btn" id="btn-link" data-tooltip="Link two entities" onclick="toggleEdgeMode()" style="margin-top: 10px;">
                <i class="ph ph-vector-two"></i>
            </button>
            <button class="tool-btn" id="btn-directed" data-tooltip="Toggle directed links" onclick="toggleDirected()">
                <i class="ph ph-arrow-right"></i>
            </button>
            <button class="tool-btn danger" data-tooltip="Delete selection" onclick="deleteSelected()">
                <i class="ph ph-trash"></i>
            </button>
            <button class="tool-btn" data-tooltip="Reset workspace" onclick="clearGraph()" style="margin-top: 20px;">
                <i class="ph ph-broom"></i>
            </button>
            <button class="tool-btn" id="btn-filter" data-tooltip="Filter entity types" onclick="toggleFilterPanel()" style="margin-top: 20px;">
                <i class="ph ph-funnel"></i>
            </button>
        </div>

        <div class="filter-panel" id="filterPanel">
            <div class="filter-panel-title">Entity types <span class="link" onclick="setAllTypeFilters(true)">All</span></div>
            <div id="filterPanelContent"></div>
        </div>

        <canvas id="minimap" width="180" height="120" onclick="minimapNavigate(event)"></canvas>

        <div id="mynetwork"></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4 class="sidebar-title"><i class="ph-fill ph-scan"></i> Entity Properties</h4>
                <button class="close-btn" onclick="closeSidebar()"><i class="ph ph-x"></i></button>
            </div>
            <div id="sidebar-content" class="sidebar-content"></div>
        </div>

        <div class="toast-container" id="toast-container"></div>
        <div id="contextMenu" class="context-menu"></div>
    </div>

    <div class="modal-overlay" id="nodeModal">
        <div class="modal-box">
            <h3 class="modal-title"><i class="ph-fill ph-cube"></i> New Entity</h3>
            <div class="form-group">
                <label class="form-label">Classification</label>
                <select class="custom-select" id="nodeType">
                    <option value="person">Identity</option>
                    <option value="company">Company</option>
                    <option value="phone">Phone</option>
                    <option value="email">Email Address</option>
                    <option value="address">Physical Address</option>
                    <option value="id">Username</option>
                    <option value="ip">IP Address</option>
                    <option value="bank">Bank Information</option>
                    <option value="note">Note</option>
                </select>
           
            <div class="form-group" id="platform-group" style="display: none;">
                <label class="form-label">Platform (ex: twitter.com)</label>
                <input type="text" class="custom-input" id="nodePlatform" placeholder="Domain for logo..." autocomplete="off">
            </div>
            </div>
            <div class="form-group">
                <label class="form-label">Value</label>
                <input type="text" class="custom-input" id="nodeValue" placeholder="ex: johndoe1" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeNodeModal()">Cancel</button>
                <button class="btn-modal btn-confirm" onclick="saveNewNode()">Confirm</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="statsModal">
        <div class="modal-box" style="width: 480px;">
            <h3 class="modal-title"><i class="ph-fill ph-chart-bar"></i> Graph Stats</h3>

    // --- OSINT ICON GENERATOR (SVG) ---
        function createIconUrl(pathData, bgColor) {
            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="128" height="128">
                <circle cx="24" cy="24" r="24" fill="${bgColor}" />
                <g transform="translate(12, 12)">
                    <path fill="#FFFFFF" d="${pathData}"/>
                </g>
            </svg>`;
            return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace(/\n/g, '').replace(/\s+/g, ' '));
        }
    
        function escapeHTML(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, function(tag) {
                const charsToReplace = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
                return charsToReplace[tag] || tag;
            });
        }

        function buildMenuItem(iconClass, text, handler, danger) {
            const item = document.createElement('div');
            item.className = 'menu-item' + (danger ? ' menu-danger' : '');
            const icon = document.createElement('i');
            icon.className = iconClass;
            item.appendChild(icon);
            item.appendChild(document.createTextNode(' ' + text));
            item.addEventListener('click', handler);
            return item;
        }

        function buildMenuSeparator() {
            const sep = document.createElement('div');
            sep.className = 'menu-separator';

    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        let icon = 'ph-info';
        if(type === 'success') icon = 'ph-check-circle';
        if(type === 'error') icon = 'ph-warning-circle';
        
        toast.innerHTML = `<i class="ph-fill ${icon}" style="font-size: 1.2rem;"></i> <span>${message}</span>`;
        container.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function showDuplicateToast(existingId, newId, existingValue) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast error';

        const icon = document.createElement('i');
        icon.className = 'ph-fill ph-warning-circle';
        icon.style.fontSize = '1.2rem';
        toast.appendChild(icon);

        const span = document.createElement('span');
        span.textContent = `Probable duplicate: "${existingValue}" already exists.`;
        toast.appendChild(span);

        const btn = document.createElement('button');
        btn.className = 'toast-action-btn';
        btn.textContent = 'Merge';
        btn.addEventListener('click', function() {
            mergeNodes(existingId, newId);
            dismissToast(toast);
        });
        toast.appendChild(btn);

        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        var autoDismiss = setTimeout(() => dismissToast(toast), 8000);
        btn.addEventListener('click', () => clearTimeout(autoDismiss));
    }

    function dismissToast(toast) {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }

    function checkDuplicateFor(nodeId) {
        var node = nodes.get(nodeId);
        if (!node || !node.details) return;
        var type = node.details.TypeKey;
        var raw = (node.details["Raw Data"] || "").trim().toLowerCase();
        if (!raw) return;

        var match = nodes.get().find(function(n) {
            return n.id !== nodeId && n.details &&
                n.details.TypeKey === type &&
                (n.details["Raw Data"] || "").trim().toLowerCase() === raw;
        });

        if (match) showDuplicateToast(match.id, nodeId, match.details["Raw Data"]);
    }

    // --- ENTITY SEARCH ---
    function performSearch(query) {
        query = query.trim().toLowerCase();
        searchMatches = [];
        searchIndex = -1;

        if (query && nodes) {
            nodes.get().forEach(function(n) {
                var label = (n.label || "").toLowerCase();
                var raw = (n.details && n.details["Raw Data"] || "").toLowerCase();
                var notes = (n.details && n.details.Notes || "").toLowerCase();
                var tags = (n.tags || []).map(t => t.text.toLowerCase()).join(' ');
                if (label.includes(query) || raw.includes(query) || notes.includes(query) || tags.includes(query)) searchMatches.push(n.id);
            });
        }

        updateSearchStatus();
        if (searchMatches.length > 0) goToSearchMatch(0);
    }

    function goToSearchMatch(index) {
        if (!network || searchMatches.length === 0) return;
        searchIndex = ((index % searchMatches.length) + searchMatches.length) % searchMatches.length;
        var id = searchMatches[searchIndex];

        network.selectNodes([id]);
        network.focus(id, { scale: 1.2, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
        openSidebar(nodes.get(id));
        updateSearchStatus();
    }

    function updateSearchStatus() {
        var status = document.getElementById('search-status');
        if (!status) return;
        var query = document.getElementById('searchInput').value.trim();
        if (!query) { status.textContent = ''; }
        else if (searchMatches.length === 0) { status.textContent = '0 results'; }
        else { status.textContent = (searchIndex + 1) + '/' + searchMatches.length; }
    }

            physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -80, centralGravity: 0.01, springLength: 150, springConstant: 0.08, damping: 0.4 } },

        network.on("selectNode", function (params) { openSidebar(nodes.get(params.nodes[0])); });

            network.on("dragging", scheduleMinimapDraw);

            // --- SMART CONTEXT MENU HANDLING ---
        network.on("oncontext", function (params) {
            params.event.preventDefault(); 
            
            var DOMPos = params.pointer.DOM;
            rightClickPos = params.pointer.canvas; 
            
            var nodeId = network.getNodeAt(DOMPos);
            var edgeId = network.getEdgeAt(DOMPos);
            var selectedNodes = network.getSelectedNodes();
            
            var menu = document.getElementById('contextMenu');
            menu.replaceChildren();

            // 1. MERGE HANDLING (2 nodes selected)
            if (selectedNodes.length === 2 && selectedNodes.includes(nodeId)) {
                var sourceNodeId = selectedNodes.find(id => id !== nodeId); // The one being absorbed
                menu.appendChild(buildMenuItem('ph ph-git-merge', 'Merge into this entity', function() { mergeNodes(nodeId, sourceNodeId); }));
                menu.appendChild(buildMenuSeparator());
                menu.appendChild(buildMenuItem('ph ph-x', 'Clear selection', function() { document.getElementById('contextMenu').style.display = 'none'; network.unselectAll(); }));
            }
            // 2. SINGLE NODE HANDLING
            else if (nodeId) {
                if (!selectedNodes.includes(nodeId)) network.selectNodes([nodeId]);
                openSidebar(nodes.get(nodeId));

                menu.appendChild(buildMenuItem('ph ph-pencil-simple', "Edit entity", function() { editNode(nodeId); }));
                menu.appendChild(buildMenuItem('ph ph-link', 'Link to...', function() { startLinking(); }));

                menu.appendChild(buildMenuItem('ph ph-trash', 'Delete', function() { deleteSpecificNode(nodeId); }, true));

                menu.appendChild(buildMenuItem('ph ph-trash', 'Delete link', function() { deleteSpecificEdge(edgeId); }, true));

            var menuHeight = menu.offsetHeight;

                        setTimeout(() => showToast("Previous session restored.", "info"), 500);
                    }
                } catch (err) {
                    console.error("Corrupted autosave", err);
                }
            }

            // === RESTORE SESSION ON STARTUP ===
            var savedSession = localStorage.getItem('GraphOSINT_Autosave');
            if (savedSession) {
                try {
                    var parsed = JSON.parse(savedSession);
                    if (parsed.nodes && parsed.nodes.length > 0) {
                        nodes.add(parsed.nodes);
                        edges.add(parsed.edges || []);
                        setTimeout(() => showToast("Previous session restored.", "info"), 500);
                    }
                } catch (err) { console.error("Corrupted autosave", err); }
            }

            // Restored nodes may carry a font color baked in under a
            // different theme; resync them to the theme active right now.
            applyNodeFontColor();

            // Take an initial "snapshot" right after startup
            setTimeout(saveSnapshot, 200);

            // === SAVE AND HISTORY TRIGGERS ===
            function handleGraphMutation() {
                if (isHoverEffect) return;
                saveSnapshot();
                autoSaveGraph();
                scheduleMinimapDraw();
            }

            nodes.on('*', handleGraphMutation);
            edges.on('*', handleGraphMutation);

            network.on("dragEnd", function(params) {
                if (params.nodes && params.nodes.length > 0) {
                    var positions = network.getPositions(params.nodes);
                    params.nodes.forEach(function(nodeId) {
                        var pos = positions[nodeId];
                        nodes.update({ id: nodeId, x: pos.x, y: pos.y, physics: false });

                } else {
                    handleGraphMutation();

            });

    document.addEventListener('DOMContentLoaded', initGraph);

    // --- NEIGHBOR HIGHLIGHT ON HOVER ---
    var HOVER_DIM_OPACITY = 0.15;

    var DEFAULT_EDGE_COLOR = { color: '#52525B', highlight: '#3B82F6' };

    function setHoverHighlight(nodeId) {
        if (!network) return;
        var keep = new Set([nodeId, ...network.getConnectedNodes(nodeId)]);
        var connectedEdges = new Set(network.getConnectedEdges(nodeId));

        isHoverEffect = true;
        nodes.update(nodes.get().map(n => ({ id: n.id, opacity: keep.has(n.id) ? 1 : HOVER_DIM_OPACITY })));
        edges.update(edges.get().map(e => ({ id: e.id, color: Object.assign({}, DEFAULT_EDGE_COLOR, e.color, { opacity: connectedEdges.has(e.id) ? 1 : HOVER_DIM_OPACITY }) })));
        isHoverEffect = false;
    }

    function clearHoverHighlight() {
        if (!network) return;
        isHoverEffect = true;
        nodes.update(nodes.get().map(n => ({ id: n.id, opacity: 1 })));
        edges.update(edges.get().map(e => ({ id: e.id, color: Object.assign({}, DEFAULT_EDGE_COLOR, e.color, { opacity: 1 }) })));
        isHoverEffect = false;
    }

    // --- MINIMAP ---
    var minimapRAF = null;
    function scheduleMinimapDraw() {
        if (minimapRAF) return;
        minimapRAF = requestAnimationFrame(function() { minimapRAF = null; drawMinimap(); });
    }

    function getMinimapTransform() {
        var canvas = document.getElementById('minimap');
        var positions = network.getPositions();
        var ids = Object.keys(positions);
        if (ids.length === 0) return null;

        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        ids.forEach(function(id) {
            var p = positions[id];
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
        });
        var pad = 60;
        minX -= pad; maxX += pad; minY -= pad; maxY += pad;
        var worldW = Math.max(maxX - minX, 1);
        var worldH = Math.max(maxY - minY, 1);
        var scale = Math.min(canvas.width / worldW, canvas.height / worldH);
        var offsetX = (canvas.width - worldW * scale) / 2;
        var offsetY = (canvas.height - worldH * scale) / 2;

        return {
            toMap: function(x, y) { return { x: (x - minX) * scale + offsetX, y: (y - minY) * scale + offsetY }; },
            toWorld: function(x, y) { return { x: (x - offsetX) / scale + minX, y: (y - offsetY) / scale + minY }; }
        };
    }

    function drawMinimap() {
        var canvas = document.getElementById('minimap');
        if (!network || !canvas) return;
        var nodeList = nodes.get();
        canvas.classList.toggle('visible', nodeList.length > 0);
        if (nodeList.length === 0) return;

        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var t = getMinimapTransform();
        if (!t) return;

        nodeList.forEach(function(n) {
            var pos = network.getPositions([n.id])[n.id];
            if (!pos) return;
            var mapped = t.toMap(pos.x, pos.y);
            ctx.beginPath();
            ctx.arc(mapped.x, mapped.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = (n.color && n.color.border) || '#3B82F6';
            ctx.fill();
        });

        var container = document.getElementById('mynetwork');
        var scaleZoom = network.getScale();
        var viewPos = network.getViewPosition();
        var viewW = container.clientWidth / scaleZoom;
        var viewH = container.clientHeight / scaleZoom;
        var topLeft = t.toMap(viewPos.x - viewW / 2, viewPos.y - viewH / 2);
        var bottomRight = t.toMap(viewPos.x + viewW / 2, viewPos.y + viewH / 2);

        ctx.strokeStyle = '#3B82F6';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(topLeft.x, topLeft.y, bottomRight.x - topLeft.x, bottomRight.y - topLeft.y);
    }

        var y = event.clientY - rect.top;
        var world = t.toWorld(x, y);
        network.moveTo({ position: { x: world.x, y: world.y }, animation: { duration: 300 } });
    }

    // --- FUNCTION B: MERGE TWO ENTITIES ---
    function mergeNodes(targetId, sourceId) {
        document.getElementById('contextMenu').style.display = 'none';

        var connectedEdges = network.getConnectedEdges(sourceId);
        var newEdges = [];

        connectedEdges.forEach(function(edgeId) {
            var edge = edges.get(edgeId);
            
            if ((edge.from === targetId && edge.to === sourceId) || (edge.from === sourceId && edge.to === targetId)) {
                return;
            }

            // Copy the edge and redirect it to the Target
            var newEdge = { ...edge, id: generateSafeUUID() }; 
            if (newEdge.from === sourceId) newEdge.from = targetId;
            if (newEdge.to === sourceId) newEdge.to = targetId;
            newEdges.push(newEdge);
        });

        // 2. Merge metadata
        var targetNode = nodes.get(targetId);
        var sourceNode = nodes.get(sourceId);

        if(sourceNode.details && targetNode.details) {
            for (const [key, value] of Object.entries(sourceNode.details)) {
                if(key !== "TypeKey" && key !== "Classification") {
                     if(!targetNode.details[key]) {
                         targetNode.details[key] = value; // Add missing info
                     } else if (targetNode.details[key] !== value) {
                         targetNode.details[key + " (Old)"] = value; // Keep track of conflicts
                     }
                }
            }

            var mergedTags = (targetNode.tags || []).slice();
            (sourceNode.tags || []).forEach(function(tag) {
                if (!mergedTags.some(t => t.text.toLowerCase() === tag.text.toLowerCase())) mergedTags.push(tag);
            });
            targetNode.tags = mergedTags;

            nodes.update(targetNode);
        }

        // 3. Nuclear execution: replace the edges and destroy the Source
        edges.remove(connectedEdges); 
        edges.add(newEdges);          
        nodes.remove(sourceId);       

        network.unselectAll();
        showToast("Entities merged successfully.", "success");
        openSidebar(nodes.get(targetId)); // Refresh the panel
    }

    // --- AUTOSAVE SYSTEM (LOCALSTORAGE) ---
        function autoSaveGraph() {
            if (!network) return;
            
            var currentPositions = network.getPositions();
            var nodesData = nodes.get().map(n => {
                if (currentPositions[n.id]) {
                    n.x = currentPositions[n.id].x;
                    n.y = currentPositions[n.id].y;
                }
                return n;
            });
            
            var backup = { nodes: nodesData, edges: edges.get() };
            localStorage.setItem('GraphOSINT_Autosave', JSON.stringify(backup));
        }
        // --- TIME MACHINE (UNDO / REDO) ---
        var historyStack = [];
        var historyIndex = -1;
        var isRestoring = false;

        function saveSnapshot() {
            if (isRestoring || !network) return;

            var currentPositions = network.getPositions();
            var nodesData = nodes.get().map(n => {
                if (currentPositions[n.id]) {
                    n.x = currentPositions[n.id].x;
                    n.y = currentPositions[n.id].y;
                }
                return n;
            });
            
            var snapshot = JSON.stringify({ nodes: nodesData, edges: edges.get() });

            if (historyIndex >= 0 && historyStack[historyIndex] === snapshot) return;

            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(snapshot);

            if (historyStack.length > 10) {
                historyStack.shift();
            } else {
                historyIndex++;
            }
        }

        function restoreSnapshot(index) {
            if (index < 0 || index >= historyStack.length) return;
            
            isRestoring = true; // Lock it
            try {
                var parsed = JSON.parse(historyStack[index]);
                nodes.clear();
                edges.clear();
                nodes.add(parsed.nodes);
                edges.add(parsed.edges);
                network.fit({ animation: { duration: 500 } });
            } catch(e) {
                console.error("Restore error", e);
            }
            
            isRestoring = false;
            autoSaveGraph(); 
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreSnapshot(historyIndex);
                showToast("Action undone", "info");
            } else {
                showToast("Nothing to undo", "error");
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                restoreSnapshot(historyIndex);
                showToast("Action redone", "info");
            }
        }

        document.addEventListener('keydown', function(e) {
            var activeTag = document.activeElement.tagName.toLowerCase();
            if (activeTag === 'input' || activeTag === 'textarea') return;

            if (e.ctrlKey || e.metaKey) { // Supports Mac (Cmd) and Windows/Linux (Ctrl)
                if (e.key === 'z') { e.preventDefault(); undo(); }
                if (e.key === 'y' || (e.shiftKey && e.key === 'z') || (e.shiftKey && e.key === 'Z')) { e.preventDefault(); redo(); }
            }
        });

    // The network canvas itself has a transparent background (the dark
    // page background is plain CSS behind it), so a raw export shows the
    // light node/edge text with nothing behind it. This paints the canvas
    // onto an opaque copy filled with the app's background color first.
    function flattenCanvasBackground(canvas) {
        var out = document.createElement('canvas');
        out.width = canvas.width;
        out.height = canvas.height;
        var ctx = out.getContext('2d');
        ctx.fillStyle = '#09090B';
        ctx.fillRect(0, 0, out.width, out.height);
        ctx.drawImage(canvas, 0, 0);
        return out;
    }

    // Favicon images (icon.horse) are loaded cross-origin without CORS
    // headers, which taints the canvas and blocks toDataURL(). To export
    // anyway, node images that aren't already a same-origin data: URI are
    // temporarily swapped for the generated OSINT icon, captured, then
    // restored once the capture is done.
    function withExportableCanvas(callback) {
        var canvas = document.querySelector('#mynetwork canvas');
        try {
            callback(flattenCanvasBackground(canvas));
            return;
        } catch (err) {
            // Tainted canvas: fall through to the swap-and-retry path below.
        }

        var externalNodes = nodes.get().filter(n => n.image && !n.image.startsWith('data:'));
        if (externalNodes.length === 0) {
            showToast("Export blocked by a browser security restriction.", "error");
            return;
        }

        var backups = externalNodes.map(n => ({ id: n.id, image: n.image }));
        var swapped = externalNodes.map(n => {
            var config = ENTITY_CONFIG[n.details && n.details.TypeKey];
            return { id: n.id, image: config ? createIconUrl(config.path, config.color) : n.image };
        });

        nodes.update(swapped);
        network.once("afterDrawing", function() {
            var cleanCanvas = document.querySelector('#mynetwork canvas');
            try {
                callback(flattenCanvasBackground(cleanCanvas));
            } catch (err2) {
                showToast("Export blocked by a browser security restriction.", "error");
            }
            nodes.update(backups);
        });
    }

    // A hand-built vector export: since it never touches the canvas, it
    // sidesteps the tainted-canvas restriction entirely and stays crisp
    // at any zoom level. Layout mirrors the current node positions but
    // edges are drawn as straight lines rather than the live curved ones.
    function exportSVG() {
        var nodeList = nodes.get();
        if (nodeList.length === 0) { showToast("Nothing to export.", "error"); return; }

        var positions = network.getPositions();
        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        nodeList.forEach(function(n) {
            var p = positions[n.id];
            if (!p) return;
            minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        });
        var pad = 80;
        minX -= pad; maxX += pad; minY -= pad; maxY += pad;
        var width = Math.max(maxX - minX, 1);
        var height = Math.max(maxY - minY, 1);

        var isLight = document.documentElement.classList.contains('light');
        var bgColor = isLight ? '#F1F5F9' : '#09090B';
        var textColor = isLight ? '#0F172A' : '#F8FAFC';

        var parts = [];
        parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${width} ${height}" width="${width}" height="${height}">`);
        parts.push(`<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>`);
        parts.push(`<rect x="${minX}" y="${minY}" width="${width}" height="${height}" fill="${bgColor}"/>`);

        edges.get().forEach(function(e) {
            var from = positions[e.from], to = positions[e.to];
            if (!from || !to) return;
            var color = (e.color && e.color.color) || '#52525B';
            var marker = directedMode ? ' marker-end="url(#arrow)"' : '';
            parts.push(`<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="${escapeHTML(color)}" stroke-width="2"${marker}/>`);
            if (e.label) {
                var mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2;
                var lw = e.label.length * 6 + 10;
                parts.push(`<rect x="${mx - lw/2}" y="${my - 9}" width="${lw}" height="18" rx="4" fill="${bgColor}"/>`);
                parts.push(`<text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="10" font-family="monospace" fill="#A1A1AA">${escapeHTML(e.label)}</text>`);
            }
        });

        nodeList.forEach(function(n) {
            var p = positions[n.id];
            if (!p) return;
            var r = (n.size || 24);
            var border = (n.color && n.color.border) || '#3B82F6';
            var clipId = 'clip-' + String(n.id).replace(/[^a-zA-Z0-9]/g, '');
            parts.push(`<clipPath id="${clipId}"><circle cx="${p.x}" cy="${p.y}" r="${r}"/></clipPath>`);
            parts.push(`<circle cx="${p.x}" cy="${p.y}" r="${r + 2}" fill="${bgColor}" stroke="${escapeHTML(border)}" stroke-width="2"/>`);
            if (n.image) parts.push(`<image href="${escapeHTML(n.image)}" x="${p.x - r}" y="${p.y - r}" width="${r * 2}" height="${r * 2}" clip-path="url(#${clipId})"/>`);
            parts.push(`<text x="${p.x}" y="${p.y + r + 18}" text-anchor="middle" font-size="13" font-family="monospace" fill="${textColor}">${escapeHTML(n.label || '')}</text>`);
        });

        parts.push('</svg>');

        var blob = new Blob([parts.join('')], { type: 'image/svg+xml' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.download = 'GraphOSINT-export.svg';
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
        showToast("SVG export complete.", "success");
    }

    function importJSON(event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var data = JSON.parse(e.target.result);
                
                var safeNodes = [];
                if (data.nodes && Array.isArray(data.nodes)) {
                    data.nodes.forEach(function(n) {
                        if (n.id && n.details) {
                            safeNodes.push({
                                id: escapeHTML(String(n.id)),
                                x: Number(n.x) || 0,
                                y: Number(n.y) || 0,
                                label: n.label ? String(n.label) : "",
                                shape: n.shape,
                                image: n.image,
                                size: Number(n.size) || 24,
                                color: n.color,
                                font: n.font,
                                borderWidth: 2,
                                physics: n.physics === false ? false : undefined,
                                details: n.details,
                                tags: Array.isArray(n.tags) ? n.tags.filter(t => t && t.text).map(t => ({
                                    id: t.id ? escapeHTML(String(t.id)) : generateSafeUUID(),
                                    text: escapeHTML(String(t.text)),
                                    color: /^#[0-9a-fA-F]{6}$/.test(t.color) ? t.color : '#3B82F6'
                                })) : []
                            });
                        }
                    });
                }

                var safeEdges = [];
                if (data.edges && Array.isArray(data.edges)) {
                    data.edges.forEach(function(ed) {
                        if (ed.from && ed.to) {
                            var edLabel = ed.label ? escapeHTML(String(ed.label)) : "";
                            safeEdges.push({
                                id: escapeHTML(String(ed.id)),
                                from: escapeHTML(String(ed.from)),
                                to: escapeHTML(String(ed.to)),
                                label: edLabel,
                                color: edLabel ? { color: colorForEdgeLabel(edLabel), highlight: '#FFFFFF' } : undefined,
                                font: ed.font
                            });
                        }
                    });
                }

                nodes.add(safeNodes);
                edges.add(safeEdges);
                
                network.fit({animation: {duration: 1000}});
                document.getElementById('fileInput').value = '';
                showToast("Database loaded.", "success");
                
            } catch (err) {
                console.error("Parse error:", err);
                showToast("Invalid JSON file.", "error");
            }
        };
        reader.readAsText(file);
    }

    // --- CSV / PLAIN LIST IMPORT ---
    // Splits one CSV line into fields, honoring double-quoted values that
    // may contain commas (a minimal RFC4180-style parser).
    function parseCSVLine(line) {
        var fields = [];
        var current = '';
        var inQuotes = false;
        for (var i = 0; i < line.length; i++) {
            var ch = line[i];
            if (inQuotes) {
                if (ch === '"' && line[i + 1] === '"') { current += '"'; i++; }
                else if (ch === '"') { inQuotes = false; }
                else { current += ch; }
            } else if (ch === '"') {
                inQuotes = true;
            } else if (ch === ',') {
                fields.push(current); current = '';
            } else {
                current += ch;
            }
        }
        fields.push(current);
        return fields.map(f => f.trim());
    }

    // Expects rows of type,value[,platform]. A "type" header row is
    // detected and skipped; unknown types fall back to "note".
    function importCSV(event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            var lines = String(e.target.result).split(/\r?\n/).filter(l => l.trim().length > 0);
            if (lines.length === 0) { showToast("Empty CSV file.", "error"); return; }

            if (/^type\s*,/i.test(lines[0])) lines.shift();

            var center = network.getViewPosition();
            var added = 0;

            lines.forEach(function(line, index) {
                var fields = parseCSVLine(line);
                var type = (fields[0] || '').trim().toLowerCase();
                var value = (fields[1] || '').trim();
                var platform = (fields[2] || '').trim();
                if (!value) return;
                if (!ENTITY_CONFIG[type]) type = 'note';

                var nodeData = buildNodeData(type, value, platform);
                nodeData.id = generateSafeUUID();
                var angle = (index / lines.length) * Math.PI * 2;
                var radius = 100 + Math.random() * 150;
                nodeData.x = center.x + Math.cos(angle) * radius;
                nodeData.y = center.y + Math.sin(angle) * radius;
                nodeData.tags = [];
                nodes.add(nodeData);
                added++;
            });

            network.fit({ animation: { duration: 800 } });
            document.getElementById('csvInput').value = '';
            showToast(`${added} entities imported from CSV.`, "success");
        };
        reader.readAsText(file);
    }

    // --- STATS ---
    function openStatsModal() {
        var nodeList = nodes.get();
        var edgeList = edges.get();

        var degree = {};
        edgeList.forEach(function(e) {
            degree[e.from] = (degree[e.from] || 0) + 1;
            degree[e.to] = (degree[e.to] || 0) + 1;
        });

        var topNode = null, topDegree = -1;
        nodeList.forEach(function(n) {
            var d = degree[n.id] || 0;
            if (d > topDegree) { topDegree = d; topNode = n; }
        });

        var counts = {};
        nodeList.forEach(function(n) {
            var type = (n.details && n.details.TypeKey) || 'note';
            counts[type] = (counts[type] || 0) + 1;
        });

        var isolated = nodeList.filter(n => !degree[n.id]).length;

        var html = `
            <div class="stats-grid">
                <div class="stat-tile"><div class="stat-value">${nodeList.length}</div><div class="stat-label">Entities</div></div>
                <div class="stat-tile"><div class="stat-value">${edgeList.length}</div><div class="stat-label">Links</div></div>
                <div class="stat-tile"><div class="stat-value">${topNode ? escapeHTML(topNode.label) : '-'}</div><div class="stat-label">Most connected (${topDegree > 0 ? topDegree : 0})</div></div>
                <div class="stat-tile"><div class="stat-value">${isolated}</div><div class="stat-label">Isolated entities</div></div>
            </div>
            <div class="form-label">Breakdown by type</div>`;

        Object.keys(counts).sort((a, b) => counts[b] - counts[a]).forEach(function(type) {
            var config = ENTITY_CONFIG[type] || ENTITY_CONFIG.note;
            html += `<div class="stat-breakdown-row"><span><span class="stat-dot" style="background:${config.border || config.color}"></span>${escapeHTML(config.title)}</span><span>${counts[type]}</span></div>`;
        });

        document.getElementById('statsContent').innerHTML = html;
        document.getElementById('statsModal').style.display = 'flex';
    }

    function closeStatsModal() {
        document.getElementById('statsModal').style.display = 'none';
    }
</script>
</body>
